name: Knight of Danika Research

on:
  push:
    branches:
      - mod/playable-knight-of-danika
    paths:
      - 'tools/**'
      - 'mods/playable-knight-of-danika/**'
      - '.github/workflows/danika-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverse-engineering-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate established class-table contracts
        run: python3 tools/audit_knight_of_danika.py

      - name: Verify true class-record alignment
        run: python3 tools/audit_danika_class_layout.py | tee danika-class-layout-report.txt

      - name: Audit class alias field
        run: python3 tools/audit_danika_class_aliases.py | tee danika-class-aliases.txt

      - name: Trace class tail-field consumers
        run: python3 tools/trace_danika_tail_field_consumers.py

      - name: Classify class-tail semantics
        run: python3 tools/classify_danika_tail_semantics.py

      - name: Scan external class-to-visual table candidates
        run: python3 tools/scan_danika_external_class_visual_tables.py

      - name: Trace class-pair dispatch table
        run: python3 tools/trace_danika_class_dispatch.py

      - name: Trace live character records into battle
        run: python3 tools/trace_danika_character_to_battle.py

      - name: Prove persistent roster provenance
        run: python3 tools/trace_danika_roster_provenance.py

      - name: Dissect world-to-battle entry bridge
        run: python3 tools/trace_danika_battle_entry_bridge.py

      - name: Scan battle lookup candidates
        run: python3 tools/scan_danika_battle_lookup.py --output danika-battle-lookup-report.txt

      - name: Trace eliminated text-resource bridge
        run: python3 tools/trace_danika_asset_bridge.py

      - name: Scan real graphics-path candidates
        run: python3 tools/scan_danika_gfx_candidates.py

      - name: Deep trace graphics-pipeline candidates
        run: python3 tools/trace_danika_gfx_pipeline.py

      - name: Correlate class fields with renderer paths
        run: python3 tools/scan_danika_renderer_accessors.py

      - name: Trace battle object class selectors
        run: python3 tools/scan_danika_battle_object_class_reads.py

      - name: Scan Dragoon weapon compatibility candidates
        run: python3 tools/scan_danika_weapon_compat.py

      - name: Trace unique renderer caller
        run: python3 tools/trace_danika_renderer_caller.py

      - name: Trace renderer callback registration and side flags
        run: python3 tools/trace_danika_render_callback.py

      - name: Trace battle-record flag writers
        run: python3 tools/trace_danika_battle_record_flags.py

      - name: Trace battle group selector state
        run: python3 tools/trace_danika_battle_selector_state.py

      - name: Trace battle object state semantics
        run: python3 tools/trace_danika_object_state_semantics.py

      - name: Trace descriptor class provenance
        run: python3 tools/trace_danika_descriptor_class_provenance.py

      - name: Prove descriptor class semantics
        run: python3 tools/trace_danika_descriptor_class_semantics.py

      - name: Trace live battle participant bridge
        run: python3 tools/trace_danika_participant_link.py

      - name: Trace live participant ownership candidates
        run: python3 tools/trace_danika_live_participant_owner.py

      - name: Trace renderer facing argument
        run: python3 tools/trace_danika_renderer_facing.py

      - name: Trace class-word upper flags
        run: python3 tools/trace_danika_classword_flags.py

      - name: Trace allied resource selector path
        run: python3 tools/trace_danika_allied_resource_path.py

      - name: Lock render-context flag chain
        run: python3 tools/trace_danika_render_context_flags.py

      - name: Classify multi-mode resource group selector
        run: python3 tools/trace_danika_resource_group_selector.py

      - name: Trace visual descriptor initializer
        run: python3 tools/trace_danika_visual_descriptor_init.py

      - name: Prove concrete visual asset selector
        run: python3 tools/trace_danika_visual_asset_selector.py

      - name: Trace dynamic combatant visual loader candidate
        run: python3 tools/trace_danika_dynamic_visual_loader.py

      - name: Trace class-driven asset consumers
        run: python3 tools/trace_danika_class_asset_consumers.py

      - name: Lock fail-closed allied gate
        run: python3 tools/test_danika_gate_contract.py

      - name: Lock visual override source safety
        run: python3 tools/test_danika_visual_override.py

      - name: Execute visual override truth table
        run: |
          gcc -std=c99 -Wall -Wextra -Werror \
            -I mods/playable-knight-of-danika \
            tools/test_danika_visual_override.c \
            -o /tmp/test_danika_visual_override
          /tmp/test_danika_visual_override

      - name: Lock read-only battle probe safety
        run: python3 tools/test_danika_battle_probe.py

      - name: Test battle probe log analyzer
        run: python3 tools/test_analyze_danika_probe_log.py

      - name: Test bank J dump analyzer
        run: python3 tools/test_analyze_danika_bankj_dump.py

      - name: Test bank C dump analyzer
        run: python3 tools/test_analyze_danika_bankc_dump.py

      - name: Test bank AH battle-setup analyzer
        run: python3 tools/test_analyze_danika_bankah_dump.py

      - name: Syntax-check battle probes
        run: |
          gcc -std=c99 -fsyntax-only -Wall -Wextra -I mods/playable-knight-of-danika/include mods/playable-knight-of-danika/src/danika_battle_probe.c
          gcc -std=c99 -fsyntax-only -Wall -Wextra -I mods/playable-knight-of-danika/include mods/playable-knight-of-danika/src/danika_bankj_probe.c
          gcc -std=c99 -fsyntax-only -Wall -Wextra -I mods/playable-knight-of-danika/include mods/playable-knight-of-danika/src/danika_bankc_probe.c
          gcc -std=c99 -fsyntax-only -Wall -Wextra -I mods/playable-knight-of-danika/include mods/playable-knight-of-danika/src/danika_bankah_probe.c

      - name: Print decisive Danika hook evidence
        run: |
          echo '=== DYNAMIC VISUAL LOADER ==='
          sed -n '/## func_801AD368/,/## func_801AE794/p' danika-dynamic-visual-loader.txt | head -n 220
          echo '=== VISUAL DESCRIPTOR INIT HIGH SIGNAL ==='
          sed -n '/High-signal lines in initializer/,/Full initializer/p' danika-visual-descriptor-init.txt | head -n 180
          echo '=== ALLIED RESOURCE PATH ==='
          grep -Ei '801AD368|801AD13C|class|selector|descriptor|combat|allied|owner|side|candidate|proven|reject' danika-allied-resource-path.txt | head -n 180 || true
          echo '=== LIVE OWNERSHIP STATIC TRACE ==='
          grep -Ei 'ownership|roster_f6|participant|candidate|branch|side|team|UNKNOWN|score=' danika-live-participant-owner.txt | head -n 220 || true
          echo '=== TAIL SEMANTICS GUARDRAIL ==='
          grep -Ei 'transition|gameplay|visual|reject|0x41|0x42|0x43|0x44|0x45|0x46' danika-tail-semantics.txt | head -n 140 || true

      - name: Upload reverse-engineering reports
        uses: actions/upload-artifact@v4
        with:
          name: danika-research-reports
          path: |
            danika-class-layout-report.txt
            danika-class-aliases.txt
            danika-tail-field-consumers.txt
            danika-tail-semantics.txt
            danika-external-class-visual-tables.txt
            danika-class-dispatch.txt
            danika-character-to-battle.txt
            danika-roster-provenance.txt
            danika-battle-entry-bridge.txt
            danika-battle-lookup-report.txt
            danika-asset-bridge-report.txt
            danika-gfx-candidate-report.txt
            danika-gfx-pipeline-trace.txt
            danika-renderer-accessor-report.txt
            danika-battle-object-class-report.txt
            danika-weapon-compat-report.txt
            danika-renderer-caller-trace.txt
            danika-render-callback-trace.txt
            danika-battle-record-flags.txt
            danika-battle-selector-state.txt
            danika-object-state-semantics.txt
            danika-descriptor-class-provenance.txt
            danika-descriptor-class-semantics.txt
            danika-participant-link.txt
            danika-live-participant-owner.txt
            danika-renderer-facing-trace.txt
            danika-classword-flags.txt
            danika-allied-resource-path.txt
            danika-render-context-flags.txt
            danika-resource-group-selector.txt
            danika-visual-descriptor-init.txt
            danika-visual-asset-selector.txt
            danika-dynamic-visual-loader.txt
            danika-class-asset-consumers.txt
          if-no-files-found: error
          retention-days: 14
