name: Knight of Danika Class Change Trace

on:
  workflow_dispatch:
  push:
    branches:
      - mod/playable-knight-of-danika
    paths:
      - 'tools/trace_danika_class_change_flow.py'
      - 'tools/trace_danika_manual_class_menu.py'
      - 'tools/trace_danika_class_commit_writes.py'
      - 'tools/trace_danika_roster_menu_bridge.py'
      - 'tools/trace_danika_selected_character_menu.py'
      - 'tools/trace_danika_class_helper_callers.py'
      - 'tools/trace_danika_menu_state_writers.py'
      - 'asm/**'
      - '.github/workflows/danika-class-change-trace.yml'

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trace native class-change flow
        run: |
          python3 tools/trace_danika_class_change_flow.py | tee /tmp/danika-class-change-flow.txt

      - name: Trace manual class menu candidates
        run: |
          python3 tools/trace_danika_manual_class_menu.py | tee /tmp/danika-manual-class-menu.txt

      - name: Trace class-id commit writes
        run: |
          python3 tools/trace_danika_class_commit_writes.py | tee /tmp/danika-class-commit-writes.txt

      - name: Trace roster to class-menu bridge
        run: |
          python3 tools/trace_danika_roster_menu_bridge.py | tee /tmp/danika-roster-menu-bridge.txt

      - name: Trace selected-character class-menu path
        run: |
          python3 tools/trace_danika_selected_character_menu.py | tee /tmp/danika-selected-character-menu.txt

      - name: Map class helper callers
        run: |
          python3 tools/trace_danika_class_helper_callers.py | tee /tmp/danika-class-helper-callers.txt

      - name: Trace menu state writers
        run: |
          python3 tools/trace_danika_menu_state_writers.py | tee /tmp/danika-menu-state-writers.txt

      - name: Publish decisive traces in job summary
        run: |
          {
            for f in danika-class-change-flow danika-manual-class-menu danika-class-commit-writes danika-roster-menu-bridge danika-selected-character-menu danika-class-helper-callers danika-menu-state-writers; do
              echo "## $f"
              echo '```text'
              cat "/tmp/$f.txt"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: danika-class-change-flow
          path: |
            /tmp/danika-class-change-flow.txt
            /tmp/danika-manual-class-menu.txt
            /tmp/danika-class-commit-writes.txt
            /tmp/danika-roster-menu-bridge.txt
            /tmp/danika-selected-character-menu.txt
            /tmp/danika-class-helper-callers.txt
            /tmp/danika-menu-state-writers.txt
          if-no-files-found: error
          retention-days: 14
