name: One-shot fix map-B source classification

on:
  push:
    branches:
      - randomizer/universal-grant
    paths:
      - '.github/workflows/one-shot-fix-map-b.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: randomizer/universal-grant
          fetch-depth: 0

      - name: Apply exact source classification fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mods/universal-item-randomizer/src/universal_item_randomizer.c')
          s = p.read_text()

          old = '''    return caller_ra == RA_MAP_OBJECT_A ||\n           caller_ra == RA_GROUND_PICKUP ||\n           caller_ra == RA_BATTLE_REWARD;'''
          new = '''    return caller_ra == RA_MAP_OBJECT_A ||\n           caller_ra == RA_MAP_OBJECT_B ||\n           caller_ra == RA_GROUND_PICKUP ||\n           caller_ra == RA_BATTLE_REWARD;'''
          assert s.count(old) == 1, 'mapped-source block changed unexpectedly'
          s = s.replace(old, new)

          old = '    if (caller_ra == RA_MAP_OBJECT_B) return 1; // pending per-unit id: no table rewrite yet'
          new = '    if (caller_ra == RA_MAP_OBJECT_B) return 0; // Table O source is already deterministically mapped'
          assert s.count(old) == 1, 'map-B direct-grant line changed unexpectedly'
          s = s.replace(old, new)

          p.write_text(s)
          PY

          git diff --check
          git diff -- mods/universal-item-randomizer/src/universal_item_randomizer.c

      - name: Commit fix and remove this one-shot workflow
        run: |
          git config user.name 'ogre-randomizer-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-fix-map-b.yml
          git add mods/universal-item-randomizer/src/universal_item_randomizer.c
          git commit -m 'randomizer: classify second map-object source correctly'
          git push origin HEAD:randomizer/universal-grant
