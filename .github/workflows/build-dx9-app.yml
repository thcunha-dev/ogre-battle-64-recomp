name: Validate Ogre Battle 64 DX9 renderer

on:
  push:
    branches:
      - dx9-lowend-410m
    paths:
      - 'app/src/dx9_renderer.inl'
      - 'app/src/null_renderer.cpp'
      - 'app/src/renderer.hpp'
      - 'app/src/gbi.cpp'
      - 'app/src/gbi.hpp'
      - 'patches/n64modernruntime-ob64.patch'
      - 'patches/n64modernruntime-n64recomp.patch'
      - '.github/workflows/build-dx9-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare LLVM-MinGW
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_MINGW_TAG=20261020
          LLVM_MINGW_FILE=llvm-mingw-${LLVM_MINGW_TAG}-msvcrt-ubuntu-22.04-x86_64.tar.xz
          curl -fL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${LLVM_MINGW_FILE}"
          mkdir -p tools/llvm-mingw
          tar -xJf /tmp/llvm-mingw.tar.xz -C tools/llvm-mingw --strip-components=1
          tools/llvm-mingw/bin/x86_64-w64-mingw32-clang++ --version | head -1

      - name: Prepare patched N64ModernRuntime headers
        shell: bash
        run: |
          set -euxo pipefail
          RUNTIME_COMMIT=589bbf018a3e6d3646ddf7de1e7919f1b7e99bb1
          rm -rf tools/N64ModernRuntime
          git clone https://github.com/N64Recomp/N64ModernRuntime.git --recurse-submodules tools/N64ModernRuntime
          git -C tools/N64ModernRuntime checkout "$RUNTIME_COMMIT"
          git -C tools/N64ModernRuntime submodule update --init --recursive
          ( cd tools/N64ModernRuntime && git apply ../../patches/n64modernruntime-ob64.patch )
          ( cd tools/N64ModernRuntime/N64Recomp && git apply ../../../patches/n64modernruntime-n64recomp.patch )

      - name: Compile DX9 renderer translation unit
        shell: bash
        run: |
          set -euxo pipefail
          CXX="$PWD/tools/llvm-mingw/bin/x86_64-w64-mingw32-clang++"
          COMMON=(
            -std=c++20 -O2 -DOGRE_USE_DX9=1 -DNOMINMAX
            -I"$PWD/app/src"
            -I"$PWD/tools/N64ModernRuntime/N64Recomp/include"
            -I"$PWD/tools/N64ModernRuntime/ultramodern/include"
            -I"$PWD/tools/N64ModernRuntime/librecomp/include"
            -I"$PWD/tools/N64ModernRuntime/thirdparty"
          )
          "$CXX" "${COMMON[@]}" -c app/src/null_renderer.cpp -o /tmp/dx9_renderer.o
          "$CXX" "${COMMON[@]}" -c app/src/gbi.cpp -o /tmp/gbi.o
          test -s /tmp/dx9_renderer.o
          test -s /tmp/gbi.o
          echo "DX9 renderer and shared GBI walker compile for Windows x86-64 without ROM-derived sources."

      - name: Verify D3D9-only renderer object
        shell: bash
        run: |
          set -euxo pipefail
          NM="$PWD/tools/llvm-mingw/bin/llvm-nm"
          "$NM" -u /tmp/dx9_renderer.o | tee /tmp/dx9-undefined.txt
          grep -q 'Direct3DCreate9' /tmp/dx9-undefined.txt
          if grep -Eqi '(D3D12|CreateDXGIFactory|vkCreateInstance)' /tmp/dx9-undefined.txt; then
            echo '::error::DX9 renderer object references a modern graphics API.'
            exit 1
          fi
