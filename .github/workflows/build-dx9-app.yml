name: Validate Ogre Battle 64 DX9 renderer

on:
  push:
    branches:
      - dx9-lowend-410m
    paths:
      - 'app/src/dx9_renderer.inl'
      - 'app/src/dx9_renderer_stage3.inl'
      - 'app/src/dx9_renderer_stage4.inl'
      - 'app/src/dx9_texture.hpp'
      - 'app/src/dx9_rdp_state.hpp'
      - 'app/src/dx9_shader.hpp'
      - 'app/src/dx9_rdp_ps.hlsl'
      - 'app/src/null_renderer.cpp'
      - 'app/src/renderer.hpp'
      - 'app/src/gbi.cpp'
      - 'app/src/gbi.hpp'
      - 'patches/n64modernruntime-ob64.patch'
      - 'patches/n64modernruntime-n64recomp.patch'
      - '.github/workflows/build-dx9-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare LLVM-MinGW
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_MINGW_TAG=20261020
          LLVM_MINGW_FILE=llvm-mingw-${LLVM_MINGW_TAG}-msvcrt-ubuntu-22.04-x86_64.tar.xz
          curl -fL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${LLVM_MINGW_FILE}"
          mkdir -p tools/llvm-mingw
          tar -xJf /tmp/llvm-mingw.tar.xz -C tools/llvm-mingw --strip-components=1
          tools/llvm-mingw/bin/x86_64-w64-mingw32-clang++ --version | head -1
          mkdir -p /tmp/win-case-shim
          printf '#pragma once\n#include <windows.h>\n' > /tmp/win-case-shim/Windows.h

      - name: Prepare patched N64ModernRuntime headers
        shell: bash
        run: |
          set -euxo pipefail
          RUNTIME_COMMIT=589bbf018a3e6d3646ddf7de1e7919f1b7e99bb1
          rm -rf tools/N64ModernRuntime
          git clone https://github.com/N64Recomp/N64ModernRuntime.git --recurse-submodules tools/N64ModernRuntime
          git -C tools/N64ModernRuntime checkout "$RUNTIME_COMMIT"
          git -C tools/N64ModernRuntime submodule update --init --recursive
          ( cd tools/N64ModernRuntime && git apply ../../patches/n64modernruntime-ob64.patch )
          ( cd tools/N64ModernRuntime/N64Recomp && git apply ../../../patches/n64modernruntime-n64recomp.patch )

      - name: Compile DX9 renderer translation unit
        shell: bash
        run: |
          set -euxo pipefail
          CXX="$PWD/tools/llvm-mingw/bin/x86_64-w64-mingw32-clang++"
          RUNTIME="$PWD/tools/N64ModernRuntime"
          COMMON=(
            -std=c++20 -O2 -DOGRE_USE_DX9=1 -DNOMINMAX
            -I/tmp/win-case-shim
            -I"$PWD/app/src"
            -I"$RUNTIME/N64Recomp/include"
            -I"$RUNTIME/ultramodern/include"
            -I"$RUNTIME/librecomp/include"
            -I"$RUNTIME/librecomp/src"
            -I"$RUNTIME/thirdparty"
            -I"$RUNTIME/thirdparty/concurrentqueue"
            -I"$RUNTIME/thirdparty/sse2neon"
            -I"$RUNTIME/thirdparty/o1heap"
          )
          "$CXX" "${COMMON[@]}" -c app/src/null_renderer.cpp -o /tmp/dx9_renderer.o
          "$CXX" "${COMMON[@]}" -c app/src/gbi.cpp -o /tmp/gbi.o
          printf '#include "dx9_texture.hpp"\n#include "dx9_rdp_state.hpp"\n#include "dx9_shader.hpp"\n' > /tmp/dx9_core_tu.cpp
          "$CXX" "${COMMON[@]}" -c /tmp/dx9_core_tu.cpp -o /tmp/dx9_core.o
          test -s /tmp/dx9_renderer.o
          test -s /tmp/gbi.o
          test -s /tmp/dx9_core.o
          echo "DX9 stage4 renderer, texture/state/shader runtime core and shared GBI walker compile for Windows x86-64."

      - name: Verify D3D9-only renderer object
        shell: bash
        run: |
          set -euxo pipefail
          NM="$PWD/tools/llvm-mingw/bin/llvm-nm"
          "$NM" -u /tmp/dx9_renderer.o | tee /tmp/dx9-undefined.txt
          grep -q 'Direct3DCreate9' /tmp/dx9-undefined.txt
          if grep -Eqi '(D3D12|CreateDXGIFactory|vkCreateInstance)' /tmp/dx9-undefined.txt; then
            echo '::error::DX9 renderer object references a modern graphics API.'
            exit 1
          fi

  shader-sm3:
    runs-on: windows-latest
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Compile RDP pixel shader as ps_3_0
        shell: pwsh
        run: |
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "${env:ProgramFiles(x86)}\Windows Kits\8.1\bin"
          ) | Where-Object { Test-Path $_ }
          $fxc = $roots | ForEach-Object {
            Get-ChildItem $_ -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue
          } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) {
            Write-Error "fxc.exe was not found in the installed Windows SDKs."
            exit 1
          }
          Write-Host "Using $($fxc.FullName)"
          New-Item -ItemType Directory -Force -Path shader-artifact | Out-Null
          $out = Join-Path (Resolve-Path shader-artifact) 'dx9_rdp_ps.cso'
          $asm = Join-Path $env:RUNNER_TEMP 'dx9_rdp_ps.asm'
          & $fxc.FullName /nologo /T ps_3_0 /E main /O3 /Fo $out /Fc $asm app/src/dx9_rdp_ps.hlsl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { exit 1 }
          $bytes = (Get-Item $out).Length
          Write-Host "ps_3_0 bytecode: $bytes bytes"
          if ($bytes -le 0 -or $bytes -gt 65536) {
            Write-Error "Unexpected SM3 shader bytecode size: $bytes"
            exit 1
          }

      - name: Upload precompiled SM3 shader
        uses: actions/upload-artifact@v4
        with:
          name: ogre-dx9-rdp-ps3
          path: shader-artifact/dx9_rdp_ps.cso
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
