name: Universal Randomizer Mapping

on:
  workflow_dispatch:
  push:
    branches:
      - randomizer/universal-grant
    paths:
      - 'mods/universal-item-randomizer/src/**'
      - 'mods/universal-item-randomizer/include/**'
      - 'tools/test_universal_randomizer_mapping.py'
      - 'tools/test_stock_runtime_coverage.py'
      - 'tools/test_randomizer_persistence_model.py'
      - 'tools/test_randomizer_source_shadow_model.py'
      - 'tools/test_randomizer_shop_model.py'
      - '.github/workflows/randomizer-mapping.yml'

jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapping invariants
        run: python3 tools/test_universal_randomizer_mapping.py
      - name: Native-save persistence model
        run: python3 tools/test_randomizer_persistence_model.py
      - name: Source-shadow generation model
        run: python3 tools/test_randomizer_source_shadow_model.py
      - name: Shop source rewrite model
        run: python3 tools/test_randomizer_shop_model.py
      - name: Stock-runtime acquisition coverage contract
        run: python3 tools/test_stock_runtime_coverage.py
