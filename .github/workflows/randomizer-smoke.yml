name: Universal Randomizer Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - randomizer/universal-grant
    paths:
      - 'mods/universal-item-randomizer/**'
      - 'tools/merge_mod_syms.py'
      - 'tools/gen_bank_funcs.py'
      - 'patches/n64modernruntime-randomizer.patch'
      - '.github/workflows/randomizer-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile tools/merge_mod_syms.py tools/gen_bank_funcs.py

      - name: Merge-symbols synthetic test
        run: |
          set -eux
          mkdir -p /tmp/ogre-syms/a /tmp/ogre-syms/b
          cat >/tmp/ogre-syms/a/dump.toml <<'EOF'
          # Autogenerated from an ELF via N64Recomp
          [[section]]
          name = ".main"
          rom = 0x00001000
          vram = 0x80000400
          size = 0x100
          functions = [ { name = "main_fn", vram = 0x80000400, size = 0x10 } ]
          EOF
          cat >/tmp/ogre-syms/b/dump.toml <<'EOF'
          # Autogenerated from an ELF via N64Recomp
          [[section]]
          name = ".bankN"
          rom = 0x00101D00
          vram = 0x801AD5C0
          size = 0x43530
          functions = [ { name = "func_ovlN_801DC740", vram = 0x801DC740, size = 0x1F0 } ]
          EOF
          python3 tools/merge_mod_syms.py /tmp/ogre-syms/merged.toml \
            /tmp/ogre-syms/a/dump.toml /tmp/ogre-syms/b/dump.toml
          grep -q 'name = "main_fn"' /tmp/ogre-syms/merged.toml
          grep -q 'name = "func_ovlN_801DC740"' /tmp/ogre-syms/merged.toml
          test "$(grep -c '^\[\[section\]\]' /tmp/ogre-syms/merged.toml)" = 2

      - name: Validate runtime patches compose
        run: |
          set -eux
          commit=589bbf018a3e6d3646ddf7de1e7919f1b7e99bb1
          git clone --filter=blob:none https://github.com/N64Recomp/N64ModernRuntime.git /tmp/N64ModernRuntime
          git -C /tmp/N64ModernRuntime checkout "$commit"
          git -C /tmp/N64ModernRuntime apply "$GITHUB_WORKSPACE/patches/n64modernruntime-ob64.patch"
          git -C /tmp/N64ModernRuntime apply --check "$GITHUB_WORKSPACE/patches/n64modernruntime-randomizer.patch"
          git -C /tmp/N64ModernRuntime apply "$GITHUB_WORKSPACE/patches/n64modernruntime-randomizer.patch"
          git -C /tmp/N64ModernRuntime diff --check -- \
            librecomp/include/librecomp/overlays.hpp \
            librecomp/src/overlays.cpp
          grep -q 'register_function_bank_symbols' /tmp/N64ModernRuntime/librecomp/include/librecomp/overlays.hpp
          grep -q 'registered_function_banks' /tmp/N64ModernRuntime/librecomp/src/overlays.cpp

      - name: Compile and link universal mod for MIPS
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mips-linux-gnu cmake ninja-build
          mod=mods/universal-item-randomizer
          mkdir -p "$mod/build"
          objs=""
          for src in "$mod"/src/*.c; do
            base=$(basename "${src%.c}")
            obj="$mod/build/$base.o"
            mips-linux-gnu-gcc \
              -mips2 -march=mips2 -mno-check-zero-division -mabi=32 -O2 -G0 \
              -mno-abicalls -mno-odd-spreg -fno-builtin -ffreestanding -nostdinc \
              -fno-pic -fno-pie -Wall -Wextra -Wno-unused-parameter \
              -I "$mod/include" -c "$src" -o "$obj"
            mips-linux-gnu-objdump -h "$obj" | grep -E 'recomp_hook|recomp_hook_return|recomp_patch' || true
            objs="$objs $obj"
          done
          mips-linux-gnu-ld -nostdlib -T "$mod/mod.ld" \
            --unresolved-symbols=ignore-all --emit-relocs -e 0 \
            -o "$mod/build/mod.elf" $objs
          mips-linux-gnu-objdump -h "$mod/build/mod.elf" | \
            grep -E 'recomp_hook|recomp_hook_return|recomp_patch'

      - name: Build pinned RecompModTool
        run: |
          set -eux
          N64RECOMP_COMMIT=81213c1831fab2521a6a5459c67b63437d67e253
          git clone https://github.com/N64Recomp/N64Recomp.git /tmp/N64Recomp
          git -C /tmp/N64Recomp checkout "$N64RECOMP_COMMIT"
          git -C /tmp/N64Recomp submodule update --init --recursive
          test "$(git -C /tmp/N64Recomp rev-parse HEAD)" = "$N64RECOMP_COMMIT"
          cmake -S /tmp/N64Recomp -B /tmp/N64Recomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/N64Recomp/build --target RecompModTool

      - name: Package NRM with minimal Rev-A references
        run: |
          set -eux
          mkdir -p mods/reference build/mods
          cat >mods/reference/dump.toml <<'EOF'
          # Minimal Rev-A reference context for Universal Item Randomizer packaging.
          [[section]]
          name = ".main"
          rom = 0x00001060
          vram = 0x80070C60
          size = 0x3E150
          functions = [
            { name = "func_80072944", vram = 0x80072944, size = 0x38 },
          ]

          [[section]]
          name = ".streamedB"
          rom = 0x00040E80
          vram = 0x8016AF80
          size = 0x265B0
          functions = [
            { name = "func_80172820", vram = 0x80172820, size = 0x100 },
          ]

          [[section]]
          name = ".bankN_record7"
          rom = 0x00101D00
          vram = 0x801AD5C0
          size = 0x43530
          functions = [
            { name = "func_ovlN_801DC740", vram = 0x801DC740, size = 0x1F0 },
          ]
          EOF
          /tmp/N64Recomp/build/RecompModTool \
            mods/universal-item-randomizer/mod.toml build/mods
          test -s build/mods/universal-item-randomizer.nrm
          ls -lh build/mods/universal-item-randomizer.nrm

      - uses: actions/upload-artifact@v4
        with:
          name: universal-item-randomizer-nrm
          path: build/mods/universal-item-randomizer.nrm
          if-no-files-found: error
