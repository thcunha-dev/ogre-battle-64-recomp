name: Package Gatekeeper Combat Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - mod/playable-knight-of-danika
    paths:
      - 'mods/gatekeeper-combat-smoke/**'
      - 'mods/playable-knight-of-danika/include/modding.h'
      - 'tools/test_gatekeeper_combat_smoke.py'
      - '.github/workflows/gatekeeper-combat-smoke-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify isolated player-roster safety contract
        run: python3 tools/test_gatekeeper_combat_smoke.py

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mips-linux-gnu cmake ninja-build unzip

      - name: Build pinned RecompModTool
        run: |
          set -eux
          N64RECOMP_COMMIT=81213c1831fab2521a6a5459c67b63437d67e253
          git clone https://github.com/N64Recomp/N64Recomp.git /tmp/N64Recomp
          git -C /tmp/N64Recomp checkout "$N64RECOMP_COMMIT"
          git -C /tmp/N64Recomp submodule update --init --recursive
          test "$(git -C /tmp/N64Recomp rev-parse HEAD)" = "$N64RECOMP_COMMIT"
          cmake -S /tmp/N64Recomp -B /tmp/N64Recomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/N64Recomp/build --target RecompModTool

      - name: Build MIPS smoke-test ELF
        run: |
          set -eux
          mod=mods/gatekeeper-combat-smoke
          mkdir -p "$mod/build" build/mods mods/reference
          common='-mips2 -march=mips2 -mno-check-zero-division -mabi=32 -O2 -G0 -mno-abicalls -mno-odd-spreg -fno-builtin -ffreestanding -fno-pic -fno-pie -Wall -Wextra -Wno-unused-parameter'
          mips-linux-gnu-gcc $common -nostdinc \
            -I mods/playable-knight-of-danika/include \
            -c "$mod/src/gatekeeper_combat_smoke.c" \
            -o "$mod/build/gatekeeper_combat_smoke.o"
          mips-linux-gnu-ld -nostdlib -T "$mod/mod.ld" \
            --unresolved-symbols=ignore-all --emit-relocs -e 0 \
            -o "$mod/build/mod.elf" "$mod/build/gatekeeper_combat_smoke.o"
          test -s "$mod/build/mod.elf"
          mips-linux-gnu-readelf -SW "$mod/build/mod.elf" | tee /tmp/gatekeeper-smoke-sections.txt
          mips-linux-gnu-nm "$mod/build/mod.elf" | tee /tmp/gatekeeper-smoke-symbols.txt
          grep -q '.recomp_hook.func_80072944' /tmp/gatekeeper-smoke-sections.txt
          ! grep -q '.recomp_patch' /tmp/gatekeeper-smoke-sections.txt
          grep -q ' T gatekeeper_combat_smoke_tick$' /tmp/gatekeeper-smoke-symbols.txt

      - name: Write minimal Rev-A function references
        run: |
          cat >mods/reference/dump.toml <<'EOF'
          [[section]]
          name = ".main"
          rom = 0x00001060
          vram = 0x80070C60
          size = 0x3E150
          functions = [
            { name = "func_80072944", vram = 0x80072944, size = 0x38 },
          ]
          EOF

      - name: Package NRM and inspect contents
        run: |
          set -eux
          tool=/tmp/N64Recomp/build/RecompModTool
          mod=mods/gatekeeper-combat-smoke
          nrm=build/mods/gatekeeper-combat-smoke.nrm
          "$tool" "$mod/mod.toml" build/mods
          test -s "$nrm"
          unzip -t "$nrm"
          unzip -Z1 "$nrm" | tee /tmp/gatekeeper-smoke-files.txt
          grep -qx 'mod.json' /tmp/gatekeeper-smoke-files.txt
          grep -qx 'mod_binary.bin' /tmp/gatekeeper-smoke-files.txt
          grep -qx 'mod_syms.bin' /tmp/gatekeeper-smoke-files.txt
          grep -qx 'TESTING.md' /tmp/gatekeeper-smoke-files.txt
          unzip -p "$nrm" mod.json | tee /tmp/gatekeeper-smoke-mod.json
          grep -q 'ogre_gatekeeper_combat_smoke' /tmp/gatekeeper-smoke-mod.json
          sha256sum "$nrm" | tee build/mods/gatekeeper-combat-smoke.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-combat-smoke
          path: |
            build/mods/gatekeeper-combat-smoke.nrm
            build/mods/gatekeeper-combat-smoke.sha256
            mods/gatekeeper-combat-smoke/TESTING.md
          if-no-files-found: error
          retention-days: 14
