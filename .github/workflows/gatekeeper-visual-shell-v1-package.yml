name: Package Gatekeeper Visual Shell v1

on:
  workflow_dispatch:
  push:
    branches:
      - mod/playable-knight-of-danika
    paths:
      - 'mods/gatekeeper-visual-shell-v1/**'
      - 'mods/playable-knight-of-danika/include/modding.h'
      - '.github/workflows/gatekeeper-visual-shell-v1-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify visual-shell safety architecture
        run: |
          set -eux
          src=mods/gatekeeper-visual-shell-v1/src/gatekeeper_visual_shell_v1.c
          grep -q '#define FIGHTER_CLASS_ID        0x02u' "$src"
          grep -q '#define DRAGOON_CLASS_ID        0x14u' "$src"
          grep -q '#define GATEKEEPER_CLASS_ID     0x71u' "$src"
          grep -q '#define CHAR_EQUIP0             0x2Au' "$src"
          grep -q '#define CLASS_EQUIP_TABLE       0x80187C62u' "$src"
          grep -q 'convert_second_fighter_to_dragoon' "$src"
          grep -q 'apply_dragoon_defaults' "$src"
          grep -q 'apply_gatekeeper_visual_shell' "$src"
          grep -q 'class_id == GATEKEEPER_CLASS_ID' "$src"
          grep -q 'class_id == DRAGOON_CLASS_ID' "$src"
          grep -q 'wr16(dragoon_records' "$src"
          grep -q 'RECOMP_HOOK("func_80072944")' "$src"
          grep -q 'RECOMP_HOOK("func_80093380")' "$src"
          ! grep -q 'RECOMP_HOOK("func_801' "$src"
          ! grep -q 'PARTICIPANT_' "$src"
          ! grep -q 'BATTLE_STATE_PTR' "$src"
          ! grep -q 'wr16(record + RECORD_CLASS' "$src"
          ! grep -q 'wr8.*GATEKEEPER_CLASS_ID' "$src"

      - name: Verify preinstalled build tools
        run: |
          set -eux
          command -v clang
          command -v rustc
          command -v readelf
          command -v cmake
          command -v ninja
          command -v unzip
          RUST_LLD="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          test -x "$RUST_LLD"
          "$RUST_LLD" -flavor gnu --version

      - name: Build pinned RecompModTool
        run: |
          set -eux
          N64RECOMP_COMMIT=81213c1831fab2521a6a5459c67b63437d67e253
          git clone https://github.com/N64Recomp/N64Recomp.git /tmp/N64Recomp
          git -C /tmp/N64Recomp checkout "$N64RECOMP_COMMIT"
          git -C /tmp/N64Recomp submodule update --init --recursive
          cmake -S /tmp/N64Recomp -B /tmp/N64Recomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/N64Recomp/build --target RecompModTool

      - name: Build MIPS visual-shell ELF
        run: |
          set -eux
          mod=mods/gatekeeper-visual-shell-v1
          mkdir -p "$mod/build" build/mods mods/reference
          common='--target=mips-linux-gnu -march=mips2 -mabi=32 -O2 -G0 -mno-abicalls -fno-builtin -ffreestanding -fno-pic -fno-pie -Wall -Wextra -Wno-unused-parameter'
          clang $common -nostdinc \
            -I mods/playable-knight-of-danika/include \
            -c "$mod/src/gatekeeper_visual_shell_v1.c" \
            -o "$mod/build/gatekeeper_visual_shell_v1.o"
          RUST_LLD="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          "$RUST_LLD" -flavor gnu -m elf32btsmip -nostdlib -T "$mod/mod.ld" \
            --unresolved-symbols=ignore-all --emit-relocs -e 0 \
            -o "$mod/build/mod.elf" "$mod/build/gatekeeper_visual_shell_v1.o"
          test -s "$mod/build/mod.elf"
          readelf -SW "$mod/build/mod.elf" | tee /tmp/gatekeeper-shell-sections.txt
          grep -q '.recomp_hook.func_80072944' /tmp/gatekeeper-shell-sections.txt
          grep -q '.recomp_hook.func_80093380' /tmp/gatekeeper-shell-sections.txt
          ! grep -q '.recomp_hook.func_801' /tmp/gatekeeper-shell-sections.txt
          ! grep -q '.recomp_patch' /tmp/gatekeeper-shell-sections.txt

      - name: Write proven resident function references
        run: |
          cat >mods/reference/dump.toml <<'EOF'
          [[section]]
          name = ".main"
          rom = 0x00001060
          vram = 0x80070C60
          size = 0x3E150
          functions = [
            { name = "func_80072944", vram = 0x80072944, size = 0x38 },
            { name = "func_80093380", vram = 0x80093380, size = 0xA0 },
          ]
          EOF

      - name: Package NRM
        run: |
          set -eux
          tool=/tmp/N64Recomp/build/RecompModTool
          mod=mods/gatekeeper-visual-shell-v1
          nrm=build/mods/gatekeeper-visual-shell-v1.nrm
          "$tool" "$mod/mod.toml" build/mods
          test -s "$nrm"
          unzip -t "$nrm"
          unzip -Z1 "$nrm" | tee /tmp/gatekeeper-shell-files.txt
          grep -qx 'mod.json' /tmp/gatekeeper-shell-files.txt
          grep -qx 'mod_binary.bin' /tmp/gatekeeper-shell-files.txt
          grep -qx 'mod_syms.bin' /tmp/gatekeeper-shell-files.txt
          grep -qx 'TESTING.md' /tmp/gatekeeper-shell-files.txt
          sha256sum "$nrm" | tee build/mods/gatekeeper-visual-shell-v1.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-visual-shell-v1
          path: |
            build/mods/gatekeeper-visual-shell-v1.nrm
            build/mods/gatekeeper-visual-shell-v1.sha256
            mods/gatekeeper-visual-shell-v1/TESTING.md
          if-no-files-found: error
          retention-days: 14
