name: Apply DX9 core patch

on:
  push:
    branches: [dx9-lowend-410m]
    paths: ['.github/workflows/dx9-run-core.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dx9-lowend-410m
          fetch-depth: 0
      - name: Apply deterministic DX9 integration
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile .github/scripts/apply_dx9_core.py
          python3 .github/scripts/apply_dx9_core.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/CMakeLists.txt dx9/CMakeLists.txt app/src/dx9_geometry.hpp app/src/dx9_renderer_stage6.inl
          git commit -m 'dx9: make renderer first-class and finish MODIFYVTX'
          git push origin HEAD:dx9-lowend-410m
