name: Universal Randomizer Stock Fast

on:
  workflow_dispatch:
  push:
    branches:
      - randomizer/universal-grant
    paths:
      - '.github/workflows/randomizer-stock-fast.yml'

jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and build ModTool
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mips-linux-gnu cmake ninja-build
          git clone --depth=1 --recurse-submodules https://github.com/N64Recomp/N64Recomp.git /tmp/N64Recomp
          cmake -S /tmp/N64Recomp -B /tmp/N64Recomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/N64Recomp/build --target RecompModTool

      - name: Prepare stock source and manifest
        run: |
          set -eux
          src=mods/universal-item-randomizer
          mod=/tmp/stock-mod
          mkdir -p "$mod/src" "$mod/include" "$mod/build" mods/reference build/mods-stock
          cp "$src"/src/*.c "$mod/src/"
          cp "$src"/include/* "$mod/include/"
          cp "$src"/mod.ld "$mod/mod.ld"
          cp "$src"/mod.toml "$mod/mod.toml"
          python3 tools/test_stock_runtime_coverage.py

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stock-mod/src/universal_item_randomizer.c')
          s=p.read_text()
          needle='RECOMP_PATCH\nvoid func_ovlN_801DC740('
          assert s.count(needle)==1
          s=s.replace(needle,'static void stock_unused_func_ovlN_801DC740(',1)
          start_cfg='s_starting_items_enabled = recomp_get_config_u32("starting_items") != 0u;'
          assert s.count(start_cfg)==1
          s=s.replace(start_cfg,'s_starting_items_enabled = 0u;',1)
          p.write_text(s)

          m=Path('/tmp/stock-mod/mod.toml')
          t=m.read_text()
          t=t.replace('id = "ogre_universal_item_randomizer"',
                      'id = "ogre_universal_item_randomizer_stock"',1)
          t=t.replace('display_name = "Universal Item Randomizer"',
                      'display_name = "Universal Item Randomizer (Stock Runtime)"',1)
          t=t.replace('mod_filename = "universal-item-randomizer"',
                      'mod_filename = "universal-item-randomizer-stock"',1)
          start=t.find('[[manifest.config_options]]\nid = "starting_items"')
          assert start!=-1
          end=t.find('[[manifest.config_options]]',start+1)
          assert end!=-1
          t=t[:start]+t[end:]
          m.write_text(t)
          PY

          grep -q 'id = "ogre_universal_item_randomizer_stock"' "$mod/mod.toml"
          grep -q 'version = "0.3.0"' "$mod/mod.toml"
          ! grep -q 'id = "starting_items"' "$mod/mod.toml"

      - name: Compile stock source objects
        run: |
          set -eux
          mod=/tmp/stock-mod
          for c in "$mod"/src/*.c; do
            base=$(basename "${c%.c}")
            mips-linux-gnu-gcc \
              -mips2 -march=mips2 -mno-check-zero-division -mabi=32 -O2 -G0 \
              -mno-abicalls -mno-odd-spreg -fno-builtin -ffreestanding -nostdinc \
              -fno-pic -fno-pie -Wall -Wextra -Wno-unused-parameter \
              -I "$mod/include" -c "$c" -o "$mod/build/$base.o"
          done

      - name: Link and prove Bank-N replacement is absent
        run: |
          set -eux
          mod=/tmp/stock-mod
          objs=$(printf '%s ' "$mod"/build/*.o)
          mips-linux-gnu-ld -nostdlib -T "$mod/mod.ld" \
            --unresolved-symbols=ignore-all --emit-relocs -e 0 \
            -o "$mod/build/mod.elf" $objs
          echo '== code-mod sections =='
          mips-linux-gnu-objdump -h "$mod/build/mod.elf" | grep -E 'recomp_hook|recomp_patch'
          echo '== symbols =='
          mips-linux-gnu-nm "$mod/build/mod.elf" | grep -E 'func_80072944|func_80172820|func_ovlN_801DC740' || true
          ! mips-linux-gnu-nm "$mod/build/mod.elf" | grep -q 'func_ovlN_801DC740'

      - name: Write base-only reference symbols
        run: |
          cat >mods/reference/dump.toml <<'EOF'
          [[section]]
          name = ".main"
          rom = 0x00001060
          vram = 0x80070C60
          size = 0x3E150
          functions = [
            { name = "func_80072944", vram = 0x80072944, size = 0x38 },
          ]

          [[section]]
          name = ".streamedB"
          rom = 0x00040E80
          vram = 0x8016AF80
          size = 0x265B0
          functions = [
            { name = "func_80172820", vram = 0x80172820, size = 0x100 },
          ]
          EOF

      - name: Package stock-runtime NRM (capture diagnostics)
        id: package
        run: |
          set +e
          mkdir -p build/mods-stock
          /tmp/N64Recomp/build/RecompModTool /tmp/stock-mod/mod.toml build/mods-stock \
            >build/mods-stock/package.log 2>&1
          status=$?
          echo "$status" >build/mods-stock/package.status
          cat build/mods-stock/package.log
          if [ "$status" -eq 0 ] && [ -s build/mods-stock/universal-item-randomizer-stock.nrm ]; then
            unzip -l build/mods-stock/universal-item-randomizer-stock.nrm \
              >build/mods-stock/nrm-contents.txt 2>&1
            cat build/mods-stock/nrm-contents.txt
            ls -lh build/mods-stock/universal-item-randomizer-stock.nrm
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-item-randomizer-stock-diagnostic
          path: |
            build/mods-stock/package.log
            build/mods-stock/package.status
            build/mods-stock/nrm-contents.txt
            build/mods-stock/universal-item-randomizer-stock.nrm
          if-no-files-found: warn

      - name: Assert stock package success
        run: |
          set -eux
          test "$(cat build/mods-stock/package.status)" = 0
          test -s build/mods-stock/universal-item-randomizer-stock.nrm
