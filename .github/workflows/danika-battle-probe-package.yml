name: Package Knight of Danika Battle Probe

on:
  workflow_dispatch:
  push:
    branches:
      - mod/playable-knight-of-danika
    paths:
      - 'mods/playable-knight-of-danika/src/**'
      - 'mods/playable-knight-of-danika/include/**'
      - 'mods/playable-knight-of-danika/*.h'
      - 'mods/playable-knight-of-danika/mod.toml'
      - 'mods/playable-knight-of-danika/mod.ld'
      - 'mods/playable-knight-of-danika/BATTLE-PROBE.md'
      - 'tools/analyze_danika_probe_log.py'
      - 'tools/test_analyze_danika_probe_log.py'
      - 'tools/analyze_danika_bankj_dump.py'
      - 'tools/test_analyze_danika_bankj_dump.py'
      - 'tools/analyze_danika_bankc_dump.py'
      - 'tools/test_analyze_danika_bankc_dump.py'
      - 'tools/test_danika_battle_probe.py'
      - 'tools/test_danika_visual_override.py'
      - 'tools/test_danika_visual_override.c'
      - '.github/workflows/danika-battle-probe-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify read-only probe contract
        run: python3 tools/test_danika_battle_probe.py

      - name: Verify probe log analyzer
        run: python3 tools/test_analyze_danika_probe_log.py

      - name: Verify bank J dump analyzer
        run: python3 tools/test_analyze_danika_bankj_dump.py

      - name: Verify bank C dump analyzer
        run: python3 tools/test_analyze_danika_bankc_dump.py

      - name: Verify dormant visual resolver contract
        run: |
          python3 tools/test_danika_visual_override.py
          gcc -std=c99 -Wall -Wextra -Werror \
            -I mods/playable-knight-of-danika \
            tools/test_danika_visual_override.c \
            -o /tmp/test_danika_visual_override
          /tmp/test_danika_visual_override
          ! grep -Eq 'RECOMP_(HOOK|PATCH|FORCE_PATCH)[[:space:]]*\(' \
            mods/playable-knight-of-danika/src/danika_visual_contract.c

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mips-linux-gnu cmake ninja-build unzip

      - name: Build pinned RecompModTool
        run: |
          set -eux
          N64RECOMP_COMMIT=81213c1831fab2521a6a5459c67b63437d67e253
          git clone https://github.com/N64Recomp/N64Recomp.git /tmp/N64Recomp
          git -C /tmp/N64Recomp checkout "$N64RECOMP_COMMIT"
          git -C /tmp/N64Recomp submodule update --init --recursive
          test "$(git -C /tmp/N64Recomp rev-parse HEAD)" = "$N64RECOMP_COMMIT"
          cmake -S /tmp/N64Recomp -B /tmp/N64Recomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/N64Recomp/build --target RecompModTool

      - name: Build MIPS probe ELF
        run: |
          set -eux
          mod=mods/playable-knight-of-danika
          mkdir -p "$mod/build" build/mods mods/reference
          common='-mips2 -march=mips2 -mno-check-zero-division -mabi=32 -O2 -G0 -mno-abicalls -mno-odd-spreg -fno-builtin -ffreestanding -fno-pic -fno-pie -Wall -Wextra -Wno-unused-parameter'
          mips-linux-gnu-gcc $common -nostdinc \
            -I "$mod/include" -c "$mod/src/danika_battle_probe.c" \
            -o "$mod/build/danika_battle_probe.o"
          mips-linux-gnu-gcc $common -nostdinc \
            -I "$mod/include" -c "$mod/src/danika_bankj_probe.c" \
            -o "$mod/build/danika_bankj_probe.o"
          mips-linux-gnu-gcc $common -nostdinc \
            -I "$mod/include" -c "$mod/src/danika_bankc_probe.c" \
            -o "$mod/build/danika_bankc_probe.o"
          mips-linux-gnu-gcc $common \
            -I "$mod" -c "$mod/src/danika_visual_contract.c" \
            -o "$mod/build/danika_visual_contract.o"
          mips-linux-gnu-nm "$mod/build/danika_bankj_probe.o" | tee /tmp/danika-bankj-probe-symbols.txt
          grep -q ' T danika_bankj_probe_tick$' /tmp/danika-bankj-probe-symbols.txt
          mips-linux-gnu-nm "$mod/build/danika_bankc_probe.o" | tee /tmp/danika-bankc-probe-symbols.txt
          grep -q ' T danika_bankc_probe_tick$' /tmp/danika-bankc-probe-symbols.txt
          mips-linux-gnu-nm "$mod/build/danika_visual_contract.o" | tee /tmp/danika-visual-contract-symbols.txt
          grep -q ' T danika_mips_visual_contract$' /tmp/danika-visual-contract-symbols.txt
          mips-linux-gnu-ld -nostdlib -T "$mod/mod.ld" \
            --unresolved-symbols=ignore-all --emit-relocs -e 0 \
            -o "$mod/build/mod.elf" \
            "$mod/build/danika_battle_probe.o" \
            "$mod/build/danika_bankj_probe.o" \
            "$mod/build/danika_bankc_probe.o" \
            "$mod/build/danika_visual_contract.o"
          test -s "$mod/build/mod.elf"
          mips-linux-gnu-readelf -SW "$mod/build/mod.elf" | tee /tmp/danika-probe-sections.txt
          mips-linux-gnu-nm "$mod/build/mod.elf" | tee /tmp/danika-probe-symbols.txt
          grep -q '.recomp_hook.func_80072944' /tmp/danika-probe-sections.txt
          ! grep -q '.recomp_patch' /tmp/danika-probe-sections.txt
          grep -q ' T danika_bankj_probe_tick$' /tmp/danika-probe-symbols.txt
          grep -q ' T danika_bankc_probe_tick$' /tmp/danika-probe-symbols.txt
          grep -q ' T danika_mips_visual_contract$' /tmp/danika-probe-symbols.txt

      - name: Write minimal Rev-A function references
        run: |
          cat >mods/reference/dump.toml <<'EOF'
          [[section]]
          name = ".main"
          rom = 0x00001060
          vram = 0x80070C60
          size = 0x3E150
          functions = [
            { name = "func_80072944", vram = 0x80072944, size = 0x38 },
          ]
          EOF

      - name: Package NRM and inspect contents
        run: |
          set -eux
          tool=/tmp/N64Recomp/build/RecompModTool
          mod=mods/playable-knight-of-danika
          nrm=build/mods/knight-of-danika-battle-probe.nrm
          "$tool" "$mod/mod.toml" build/mods
          test -s "$nrm"
          unzip -t "$nrm"
          unzip -Z1 "$nrm" | tee /tmp/danika-probe-files.txt
          grep -qx 'mod.json' /tmp/danika-probe-files.txt
          grep -qx 'mod_binary.bin' /tmp/danika-probe-files.txt
          grep -qx 'mod_syms.bin' /tmp/danika-probe-files.txt
          grep -qx 'BATTLE-PROBE.md' /tmp/danika-probe-files.txt
          unzip -p "$nrm" mod.json | tee /tmp/danika-probe-mod.json
          grep -q 'ogre_danika_battle_probe' /tmp/danika-probe-mod.json
          grep -q 'Knight of Danika - Battle Probe' /tmp/danika-probe-mod.json
          sha256sum "$nrm" | tee build/mods/knight-of-danika-battle-probe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: knight-of-danika-battle-probe
          path: |
            build/mods/knight-of-danika-battle-probe.nrm
            build/mods/knight-of-danika-battle-probe.sha256
            mods/playable-knight-of-danika/BATTLE-PROBE.md
            tools/analyze_danika_probe_log.py
            tools/analyze_danika_bankj_dump.py
            tools/analyze_danika_bankc_dump.py
          if-no-files-found: error
          retention-days: 14
