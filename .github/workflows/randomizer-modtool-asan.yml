name: Universal Randomizer ModTool ASan

on:
  workflow_dispatch:
  push:
    branches:
      - randomizer/universal-grant
    paths:
      - '.github/workflows/randomizer-modtool-asan.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - historical-green
          - current-central
          - current-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore historical green mod when requested
        if: matrix.variant == 'historical-green'
        run: |
          set -eux
          git rm -r --cached --ignore-unmatch mods/universal-item-randomizer >/dev/null 2>&1 || true
          rm -rf mods/universal-item-randomizer
          git checkout e1443eacf288e6c5af88a477907dd647a1fc0d21 -- mods/universal-item-randomizer

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mips-linux-gnu cmake ninja-build

      - name: Build exact historical RecompModTool with ASan
        run: |
          set -eux
          N64RECOMP_COMMIT=ffb39cdad1da5de07eaaa48bd1db4a89a7986771
          git clone https://github.com/N64Recomp/N64Recomp.git /tmp/N64Recomp
          git -C /tmp/N64Recomp checkout "$N64RECOMP_COMMIT"
          git -C /tmp/N64Recomp submodule update --init --recursive
          test "$(git -C /tmp/N64Recomp rev-parse HEAD)" = "$N64RECOMP_COMMIT"
          cmake -S /tmp/N64Recomp -B /tmp/N64Recomp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address -fno-omit-frame-pointer -g' \
            -DCMAKE_C_FLAGS='-fsanitize=address -fno-omit-frame-pointer -g' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address'
          cmake --build /tmp/N64Recomp/build --target RecompModTool

      - name: Compile mod ELF
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eux
          mod=mods/universal-item-randomizer
          mkdir -p "$mod/build" mods/reference build/mods
          objs=""
          for src in "$mod"/src/*.c; do
            base=$(basename "${src%.c}")
            obj="$mod/build/$base.o"
            mips-linux-gnu-gcc \
              -mips2 -march=mips2 -mno-check-zero-division -mabi=32 -O2 -G0 \
              -mno-abicalls -mno-odd-spreg -fno-builtin -ffreestanding -nostdinc \
              -fno-pic -fno-pie -Wall -Wextra -Wno-unused-parameter \
              -I "$mod/include" -c "$src" -o "$obj"
            if [ "$VARIANT" = current-central ]; then
              if [ "$base" = universal_item_randomizer ]; then objs="$objs $obj"; fi
            else
              objs="$objs $obj"
            fi
          done
          mips-linux-gnu-ld -nostdlib -T "$mod/mod.ld" \
            --unresolved-symbols=ignore-all --emit-relocs -e 0 \
            -o "$mod/build/mod.elf" $objs
          mips-linux-gnu-readelf -S "$mod/build/mod.elf"
          mips-linux-gnu-readelf -r "$mod/build/mod.elf" | head -200

      - name: Write reference symbols
        run: |
          cat >mods/reference/dump.toml <<'EOF'
          [[section]]
          name = ".main"
          rom = 0x00001060
          vram = 0x80070C60
          size = 0x3E150
          functions = [
            { name = "func_80072944", vram = 0x80072944, size = 0x38 },
          ]

          [[section]]
          name = ".streamedB"
          rom = 0x00040E80
          vram = 0x8016AF80
          size = 0x265B0
          functions = [
            { name = "func_80172820", vram = 0x80172820, size = 0x100 },
          ]

          [[section]]
          name = ".bankN_record7"
          rom = 0x00101D00
          vram = 0x801AD5C0
          size = 0x43530
          functions = [
            { name = "func_ovlN_801DC740", vram = 0x801DC740, size = 0x1F0 },
          ]
          EOF

      - name: Package under ASan
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=1
        run: |
          set -eux
          /tmp/N64Recomp/build/RecompModTool mods/universal-item-randomizer/mod.toml build/mods
          test -s build/mods/universal-item-randomizer.nrm
