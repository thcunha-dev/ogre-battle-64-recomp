name: Universal Randomizer Package Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - randomizer/universal-grant
    paths:
      - 'mods/universal-item-randomizer/src/**'
      - '.github/workflows/randomizer-package-matrix.yml'

jobs:
  isolate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - central
          - central-post
          - central-shop
          - central-use
          - central-shop-use
          - all
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mips-linux-gnu cmake ninja-build
          N64RECOMP_COMMIT=81213c1831fab2521a6a5459c67b63437d67e253
          git clone https://github.com/N64Recomp/N64Recomp.git /tmp/N64Recomp
          git -C /tmp/N64Recomp checkout "$N64RECOMP_COMMIT"
          git -C /tmp/N64Recomp submodule update --init --recursive
          test "$(git -C /tmp/N64Recomp rev-parse HEAD)" = "$N64RECOMP_COMMIT"
          cmake -S /tmp/N64Recomp -B /tmp/N64Recomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/N64Recomp/build --target RecompModTool

      - name: Compile all source objects
        run: |
          set -eux
          mod=mods/universal-item-randomizer
          mkdir -p "$mod/build" mods/reference build/mods
          for src in "$mod"/src/*.c; do
            base=$(basename "${src%.c}")
            mips-linux-gnu-gcc \
              -mips2 -march=mips2 -mno-check-zero-division -mabi=32 -O2 -G0 \
              -mno-abicalls -mno-odd-spreg -fno-builtin -ffreestanding -nostdinc \
              -fno-pic -fno-pie -Wall -Wextra -Wno-unused-parameter \
              -I "$mod/include" -c "$src" -o "$mod/build/$base.o"
          done

      - name: Link variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eux
          mod=mods/universal-item-randomizer
          central="$mod/build/universal_item_randomizer.o"
          post="$mod/build/post_battle_add.o"
          shop="$mod/build/shop_stock.o"
          use="$mod/build/use_repair.o"
          case "$VARIANT" in
            central) objs="$central" ;;
            central-post) objs="$central $post" ;;
            central-shop) objs="$central $shop" ;;
            central-use) objs="$central $use" ;;
            central-shop-use) objs="$central $shop $use" ;;
            all) objs="$central $post $shop $use" ;;
            *) exit 2 ;;
          esac
          mips-linux-gnu-ld -nostdlib -T "$mod/mod.ld" \
            --unresolved-symbols=ignore-all --emit-relocs -e 0 \
            -o "$mod/build/mod.elf" $objs
          echo "== sections =="
          mips-linux-gnu-objdump -h "$mod/build/mod.elf" | grep -E 'recomp_hook|recomp_patch' || true
          echo "== relocations =="
          mips-linux-gnu-objdump -r "$mod/build/mod.elf" | grep -E 'recomp_hook|recomp_patch|R_MIPS_26' || true

      - name: Write minimal reference symbols
        run: |
          cat >mods/reference/dump.toml <<'EOF'
          [[section]]
          name = ".main"
          rom = 0x00001060
          vram = 0x80070C60
          size = 0x3E150
          functions = [
            { name = "func_80072944", vram = 0x80072944, size = 0x38 },
          ]

          [[section]]
          name = ".streamedB"
          rom = 0x00040E80
          vram = 0x8016AF80
          size = 0x265B0
          functions = [
            { name = "func_80172820", vram = 0x80172820, size = 0x100 },
          ]

          [[section]]
          name = ".bankN_record7"
          rom = 0x00101D00
          vram = 0x801AD5C0
          size = 0x43530
          functions = [
            { name = "func_ovlN_801DC740", vram = 0x801DC740, size = 0x1F0 },
          ]
          EOF

      - name: Package variant
        run: |
          set -eux
          /tmp/N64Recomp/build/RecompModTool mods/universal-item-randomizer/mod.toml build/mods
          test -s build/mods/universal-item-randomizer.nrm
