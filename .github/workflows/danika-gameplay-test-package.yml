name: Package Knight of Danika Playable

on:
  workflow_dispatch:
  push:
    branches:
      - mod/playable-knight-of-danika
    paths:
      - 'mods/playable-knight-of-danika-gameplay-test/**'
      - 'mods/playable-knight-of-danika/include/modding.h'
      - '.github/workflows/danika-gameplay-test-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify allied live participant sync architecture
        run: |
          set -eux
          src=mods/playable-knight-of-danika-gameplay-test/src/danika_gameplay_test.c
          grep -q 'CHAR_TABLE              0x80193BE0u' "$src"
          grep -q 'CHAR_CLASS              0x12u' "$src"
          grep -q 'CHAR_LEVEL              0x13u' "$src"
          grep -q 'CHAR_EXP                0x35u' "$src"
          grep -q 'DANIKA_CLASS_ID         0x71u' "$src"
          grep -q 'BATTLE_STATE_PTR        0x801CE8DCu' "$src"
          grep -q 'BATTLE_SLOT_STRIDE      0xF8u' "$src"
          grep -q 'BATTLE_PARTICIPANT_OFF  0x1C4u' "$src"
          grep -q 'BATTLE_VALID_OFF        0x20Cu' "$src"
          grep -q 'BATTLE_SLOT_COUNT       20u' "$src"
          grep -q 'PARTICIPANT_LEVEL       0x31u' "$src"
          grep -q 'PARTICIPANT_EXP         0x32u' "$src"
          grep -q 'PARTICIPANT_ROSTER_IDX  0xF6u' "$src"
          grep -q 'PARTICIPANT_CLASS_HINT  0x30u' "$src"
          grep -q 'participant_matches_roster' "$src"
          grep -q 'discover_participant_class_offset' "$src"
          grep -q 'sync_target_live_participant' "$src"
          grep -q 'roster_idx == (unsigned int)s_target_roster' "$src"
          grep -q 'rd8(participant + PARTICIPANT_LEVEL) == rd8(roster + CHAR_LEVEL)' "$src"
          grep -q 'rd8(participant + PARTICIPANT_EXP) == rd8(roster + CHAR_EXP)' "$src"
          grep -q 'wr8(target + (unsigned int)s_participant_class_off' "$src"
          grep -q 'RECOMP_HOOK("func_80072944")' "$src"
          grep -q 'RECOMP_HOOK("func_80093380")' "$src"
          grep -q 'BATTLE_TABLE_PTR        0x801BA6D8u' "$src"
          grep -q 'wr16(record + RECORD_SELECTOR, selector)' "$src"
          ! grep -q 'PLAYABLE_DANIKA_ID' "$src"
          ! grep -q 'DRAGOON_CLASS_ID' "$src"
          ! grep -q 'KNIGHT_CLASS_ID' "$src"
          ! grep -q 'RECOMP_HOOK("func_801' "$src"
          ! grep -q 'wr8(participant + PARTICIPANT_ROSTER_IDX' "$src"
          ! grep -q 'wr8(participant + PARTICIPANT_LEVEL' "$src"
          ! grep -q 'wr8(participant + PARTICIPANT_EXP' "$src"
          ! grep -q 'wr16(record + RECORD_CLASS' "$src"
          ! grep -q 'wr32' "$src"

      - name: Verify preinstalled build tools
        run: |
          set -eux
          command -v clang
          command -v rustc
          command -v readelf
          command -v cmake
          command -v ninja
          command -v unzip
          RUST_LLD="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          test -x "$RUST_LLD"
          "$RUST_LLD" -flavor gnu --version

      - name: Build pinned RecompModTool
        run: |
          set -eux
          N64RECOMP_COMMIT=81213c1831fab2521a6a5459c67b63437d67e253
          git clone https://github.com/N64Recomp/N64Recomp.git /tmp/N64Recomp
          git -C /tmp/N64Recomp checkout "$N64RECOMP_COMMIT"
          git -C /tmp/N64Recomp submodule update --init --recursive
          cmake -S /tmp/N64Recomp -B /tmp/N64Recomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/N64Recomp/build --target RecompModTool

      - name: Build MIPS mod ELF
        run: |
          set -eux
          mod=mods/playable-knight-of-danika-gameplay-test
          mkdir -p "$mod/build" build/mods mods/reference
          common='--target=mips-linux-gnu -march=mips2 -mabi=32 -O2 -G0 -mno-abicalls -fno-builtin -ffreestanding -fno-pic -fno-pie -Wall -Wextra -Wno-unused-parameter'
          clang $common -nostdinc \
            -I mods/playable-knight-of-danika/include \
            -c "$mod/src/danika_gameplay_test.c" \
            -o "$mod/build/danika_gameplay_test.o"
          RUST_LLD="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          "$RUST_LLD" -flavor gnu -m elf32btsmip -nostdlib -T "$mod/mod.ld" \
            --unresolved-symbols=ignore-all --emit-relocs -e 0 \
            -o "$mod/build/mod.elf" "$mod/build/danika_gameplay_test.o"
          test -s "$mod/build/mod.elf"
          readelf -SW "$mod/build/mod.elf" | tee /tmp/danika-gameplay-sections.txt
          grep -q '.recomp_hook.func_80072944' /tmp/danika-gameplay-sections.txt
          grep -q '.recomp_hook.func_80093380' /tmp/danika-gameplay-sections.txt
          ! grep -q '.recomp_hook.func_801' /tmp/danika-gameplay-sections.txt
          ! grep -q '.recomp_patch' /tmp/danika-gameplay-sections.txt

      - name: Write proven resident function references
        run: |
          cat >mods/reference/dump.toml <<'EOF'
          [[section]]
          name = ".main"
          rom = 0x00001060
          vram = 0x80070C60
          size = 0x3E150
          functions = [
            { name = "func_80072944", vram = 0x80072944, size = 0x38 },
            { name = "func_80093380", vram = 0x80093380, size = 0xA0 },
          ]
          EOF

      - name: Package NRM
        run: |
          set -eux
          tool=/tmp/N64Recomp/build/RecompModTool
          mod=mods/playable-knight-of-danika-gameplay-test
          nrm=build/mods/knight-of-danika-playable.nrm
          "$tool" "$mod/mod.toml" build/mods
          test -s "$nrm"
          unzip -t "$nrm"
          unzip -Z1 "$nrm" | tee /tmp/danika-gameplay-files.txt
          grep -qx 'mod.json' /tmp/danika-gameplay-files.txt
          grep -qx 'mod_binary.bin' /tmp/danika-gameplay-files.txt
          grep -qx 'mod_syms.bin' /tmp/danika-gameplay-files.txt
          grep -qx 'TESTING.md' /tmp/danika-gameplay-files.txt
          sha256sum "$nrm" | tee build/mods/knight-of-danika-playable.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: knight-of-danika-playable-live-sync
          path: |
            build/mods/knight-of-danika-playable.nrm
            build/mods/knight-of-danika-playable.sha256
            mods/playable-knight-of-danika-gameplay-test/TESTING.md
          if-no-files-found: error
          retention-days: 14
