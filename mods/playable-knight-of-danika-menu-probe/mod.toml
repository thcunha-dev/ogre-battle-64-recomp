[manifest]
id = "ogre_danika_menu_probe"
version = "0.1.0"
display_name = "Knight of Danika - Native Class Menu Probe"
description = "Read-only developer probe for locating the native Change Class controller. It logs changes in the selected-character/menu state and the selected player's current class. It never writes game RAM."
short_description = "Read-only native Change Class state probe."
authors = [ "Ogre Battle 64 BR" ]
game_id = "ogrebattle64"
minimum_recomp_version = "0.1.0"
dependencies = [ ]
native_libraries = [ ]
enabled_by_default = false

[inputs]
elf_path = "build/mod.elf"
mod_filename = "knight-of-danika-menu-probe"
func_reference_syms_file = "../reference/dump.toml"
data_reference_syms_files = [ ]
additional_files = [ "TESTING.md" ]
