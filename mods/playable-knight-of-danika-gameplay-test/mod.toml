[manifest]
id = "ogre_danika_playable"
version = "0.3.0"
display_name = "Knight of Danika - Playable"
description = """
Playable Knight of Danika gameplay build. The first generic allied Fighter
(0x02) is converted to the real Gatekeeper class 0x71. The battle visual is
resolved from Ogre Battle 64's own Gatekeeper records in resource 0x315736 and
normalized before battle models are created. No streamed/banked function is
hooked and no Dragoon/Knight visual donor is used. Original enemy Gatekeepers
remain class 0x71 and retain the Gatekeeper visual.
Use a backup/disposable save while automatic conversion is enabled.
"""
short_description = "Playable Gatekeeper 0x71 with native preloaded battle visual."
authors = [ "Ogre Battle 64 BR" ]
game_id = "ogrebattle64"
minimum_recomp_version = "0.1.0"
dependencies = [ ]
native_libraries = [ ]
enabled_by_default = false

[inputs]
elf_path = "build/mod.elf"
mod_filename = "knight-of-danika-playable"
func_reference_syms_file = "../reference/dump.toml"
data_reference_syms_files = [ ]
additional_files = [ "TESTING.md" ]
