[manifest]
id = "ogre_gatekeeper_stable_bridge"
version = "0.1.0"
display_name = "Gatekeeper Stable Combat Bridge"
description = "Converts the second Fighter in the player roster to real Dragoon 0x14 as a crash-free 2H combat baseline before Gatekeeper visuals are layered back on. Development test only."
short_description = "Second Fighter -> Dragoon combat stability bridge."
authors = [ "Ogre Battle 64 BR" ]
game_id = "ogrebattle64"
minimum_recomp_version = "0.1.0"
dependencies = [ ]
native_libraries = [ ]
enabled_by_default = false

[inputs]
elf_path = "build/mod.elf"
mod_filename = "gatekeeper-stable-bridge"
func_reference_syms_file = "../reference/dump.toml"
data_reference_syms_files = [ ]
additional_files = [ "TESTING.md" ]
