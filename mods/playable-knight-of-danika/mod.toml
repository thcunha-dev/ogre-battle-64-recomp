[manifest]
id = "ogre_danika_battle_probe"
version = "0.1.0"
display_name = "Knight of Danika - Battle Probe"
description = """
Read-only diagnostic for the playable Knight of Danika project. It logs the
current battle-resource records so class IDs, visual selectors and render-context
flags can be correlated with known allied and enemy participants. It does not
change class data, graphics, inventory, battle state or save data.
"""
short_description = "Read-only battle participant diagnostics for Danika restoration."
authors = [ "Ogre Battle 64 BR" ]
game_id = "ogrebattle64"
minimum_recomp_version = "0.1.0"
dependencies = [ ]
native_libraries = [ ]
enabled_by_default = false

[inputs]
elf_path = "build/mod.elf"
mod_filename = "knight-of-danika-battle-probe"
func_reference_syms_file = "../reference/dump.toml"
data_reference_syms_files = [ ]
additional_files = [ "BATTLE-PROBE.md" ]
