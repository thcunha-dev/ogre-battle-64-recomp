[manifest]
id = "ogre_danika_class_swap_test"
version = "0.1.0"
display_name = "Knight of Danika - Allied Class Swap Test"
description = """
Developer-only test mod for the playable Knight of Danika project. It changes
only the first player-roster character whose class is Dragoon 0x14 into Knight
of Danika 0x71 so the class can be tested as an allied unit. It never edits live
enemy participant memory. Use only with a disposable/copy save and do not save
over an important file while the test mod is enabled.
"""
short_description = "Dev-only allied Dragoon 0x14 -> Knight of Danika 0x71 test."
authors = [ "Ogre Battle 64 BR" ]
game_id = "ogrebattle64"
minimum_recomp_version = "0.1.0"
dependencies = [ ]
native_libraries = [ ]
enabled_by_default = false

[inputs]
elf_path = "build/mod.elf"
mod_filename = "knight-of-danika-class-swap-test"
func_reference_syms_file = "../reference/dump.toml"
data_reference_syms_files = [ ]
additional_files = [ "TESTING.md" ]
